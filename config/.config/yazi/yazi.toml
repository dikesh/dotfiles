[mgr]
ratio = [2, 3, 5]

[opener]
edit = [
	{ run = 'nvim "$@"', block = true},
]
play = [
	{ run = 'mpv --force-window "$@"', orphan = true, for = "unix" },
]
open-image = [
  { run = 'feh --start-at "$@"', orphan = true, desc = "feh" },
]
unzip = [
	{ run = 'unzip "$@"', desc = "Extract with unzip", block = true }
]


[open]
prepend_rules = [
  { mime = "image/*", use = [ "open-image", "open" ] },
  { mime = "application/zip", use = "unzip" },
]
