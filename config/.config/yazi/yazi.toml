[mgr]
ratio = [2, 3, 5]

[opener]
edit = [
	{ run = '$EDITOR %s', block = true},
]
play = [
	{ run = 'mpv --force-window %s', orphan = true, for = "unix" },
]
open-image = [
  { run = 'feh --start-at %s', orphan = true, desc = "feh" },
]
unzip = [
	{ run = 'unzip %s', desc = "Extract with unzip", block = true }
]

[open]
prepend_rules = [
  { mime = "image/*", use = [ "open-image"] },
  { mime = "application/zip", use = "unzip" },
]
