# Styling
font_family      family="JetBrainsMono Nerd Font Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 12
background_opacity 0.9
hide_window_decorations true

# Tab bar styling
tab_bar_style powerline
tab_powerline_style angled

# Cursor
cursor_trail 10
cursor_trail_decay 0.01 0.1
cursor_trail_start_threshold 0
cursor_trail_color #e25822

# Bell
enable_audio_bell no

# Layout
enabled_layouts stack,tall:bias=55

# Padding
window_padding_width 0 6

# Mapping
map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+j remote_control scroll-window 0.5p+
map ctrl+shift+k remote_control scroll-window 0.5p-
map ctrl+shift+enter new_window_with_cwd

# fish integration
shell fish
